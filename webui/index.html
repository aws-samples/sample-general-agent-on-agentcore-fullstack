<!DOCTYPE html>
<!--
  Web chat for the agent, served as one static file.

  Who you are is established one of two ways, and everything after is the same:
    - in a browser: Cognito's hosted login (authorization code + PKCE). The page holds the
      user's own access token and sends it everywhere; the router never mints for them.
    - inside the Lark client: Lark's h5 SDK hands out a single-use code, which the router's
      /web/h5/session trades for the Lark user's token.
  Then: chat goes as AG-UI straight to the AgentCore Runtime with that token (SSE back), and
  a /command goes to the router, which owns the session ids those rotate.

  A system a tool needs and the user has not granted (Lark, Google) is authorised here, on
  demand: the page mints the link through /auth when the user clicks, and completes the
  consent itself with the same token — the only one that can complete it.
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>General Agent on AgentCore</title>
<!-- Deploy-time values (router URL, Lark app id); written by the WebUI stack. -->
<script src="config.js"></script>
<!-- The hosted login, shared with admin.html. -->
<script src="login.js"></script>
<!-- Model output is markdown. Sanitised because a tool result is untrusted input that
     reaches this page through the model. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"
        integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a"
        crossorigin="anonymous"></script>
<style>
  :root { color-scheme: light dark; --edge: color-mix(in oklab, currentColor 14%, transparent);
          --accent: #2563eb; --me-bg: #d2e4ff; --me-fg: #10233d; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", sans-serif;
         display: flex; flex-direction: column; height: 100vh; }
  header { padding: .7rem 1rem; border-bottom: 1px solid var(--edge); font-weight: 600;
           display: flex; gap: .6rem; align-items: baseline; }
  header small { font-weight: 400; opacity: .6; }
  #log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .8rem; }
  .msg { max-width: 46rem; padding: .6rem .85rem; border-radius: .8rem; overflow-wrap: anywhere; }
  /* Fixed colours, not a currentColor mix: in dark mode the mix inverts and the user's own
     messages lose the tint that distinguishes them. */
  .me { align-self: flex-end; background: var(--me-bg); color: var(--me-fg);
        white-space: pre-wrap; }
  .bot { align-self: flex-start; border: 1px solid var(--edge); }
  /* Markdown inside a bubble: kill the block margins that would otherwise pad it out. */
  .bot > :first-child { margin-top: 0; } .bot > :last-child { margin-bottom: 0; }
  .bot pre { background: color-mix(in oklab, currentColor 8%, transparent); padding: .6rem;
             border-radius: .4rem; overflow-x: auto; }
  .bot code { font-size: 13px; }
  .bot table { border-collapse: collapse; } .bot th, .bot td { border: 1px solid var(--edge); padding: .2rem .5rem; }
  .msg img { max-width: 14rem; border-radius: .4rem; display: block; margin-top: .4rem; }
  /* Command output: alignment and line breaks carry meaning, so preserve both. */
  .cmd { align-self: flex-start; white-space: pre-wrap; font-size: 13px;
         font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
         background: color-mix(in oklab, currentColor 6%, transparent);
         border: 1px solid var(--edge); }
  .cmd a { color: var(--accent); }
  /* A turn, the way the Lark card lays it out: text blocks with grey status chips between
     them, and a full-width grey band summing the turn up. */
  .turn { display: flex; flex-direction: column; gap: .5rem; align-items: flex-start; }
  .turn .block { align-self: stretch; }
  .turn .block > :first-child { margin-top: 0; } .turn .block > :last-child { margin-bottom: 0; }
  .pill { display: inline-flex; align-items: center; gap: .45rem; font-size: 12px; color: #8f959e;
          background: color-mix(in oklab, currentColor 7%, transparent); border-radius: .4rem;
          padding: .15rem .65rem; }
  .band { align-self: stretch; font-size: 12px; color: #8f959e; padding: .25rem .5rem;
          background: color-mix(in oklab, currentColor 7%, transparent); border-radius: .3rem; }
  .dots { display: inline-flex; gap: 3px; align-items: center; height: 12px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: #8f959e; display: block; }
  .dots.think i { animation: rise 1s infinite ease-in-out; }
  .dots.work i { animation: swell 1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes rise { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-3px); } }
  @keyframes swell { 0%, 100% { transform: scale(.6); } 50% { transform: scale(1.2); } }
  .think { align-self: flex-start; font-size: 13px; opacity: .55; font-style: italic;
           white-space: pre-wrap; }
  .err { align-self: flex-start; color: #c0392b; white-space: pre-wrap; }
  form { display: flex; gap: .5rem; padding: .8rem 1rem; border-top: 1px solid var(--edge);
         align-items: center; }
  input[type=text] { flex: 1; padding: .6rem .8rem; border-radius: .6rem;
                     border: 1px solid var(--edge); background: transparent; color: inherit;
                     font: inherit; min-width: 0; }
  /* Explicit colours, not `currentColor`/`Canvas`: the system-colour keyword is unsupported
     in older webviews, which renders the label in the button's own colour — invisible. */
  button { padding: .6rem 1.1rem; border-radius: .6rem; border: 0; font: inherit;
           background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
  button.ghost { background: transparent; color: inherit; border: 1px solid var(--edge);
                 padding: .5rem .7rem; font-size: 17px; line-height: 1; }
  button[disabled] { opacity: .45; cursor: default; }
  #pending { padding: 0 1rem; font-size: 13px; opacity: .7; display: none; align-items: center;
             gap: .5rem; }
  #pending img { max-height: 2.4rem; border-radius: .3rem; }
  .file { display: flex; flex-direction: column; gap: .3rem; font-size: 13px; }
  .file img { max-width: min(28rem, 100%); border-radius: .4rem; border: 1px solid var(--edge); }
  .file a { color: var(--accent); }
  /* A notice with a button, not a field: tinted and rounded, so nothing reads as an input. */
  .consent { align-self: flex-start; display: flex; gap: .8rem; align-items: center;
             padding: .5rem .55rem .5rem .85rem; border-radius: .6rem; font-size: 14px;
             background: color-mix(in oklab, var(--accent) 9%, transparent); }
  .consent button { padding: .4rem .9rem; font-size: 14px; }
  .consent .done { color: #16a34a; white-space: nowrap; }
  header button.ghost, header a.ghost { font-size: 13px; padding: .25rem .6rem; }
  header a.ghost { color: inherit; text-decoration: none; border: 1px solid var(--edge);
                   border-radius: .6rem; margin-right: .4rem; }
  header a.ghost[hidden] { display: none; }
  /* A message as Lark chat shows one: avatar beside it, sender and time above it. */
  .row { display: flex; gap: .6rem; align-items: flex-start; align-self: stretch; }
  .row.mine { flex-direction: row-reverse; }
  .row .col { display: flex; flex-direction: column; gap: .25rem; min-width: 0;
              align-items: flex-start; }
  .row.mine .col { align-items: flex-end; }
  .row .msg { align-self: auto; }
  .meta { font-size: 12px; color: #8f959e; }
  .meta:empty { display: none; }
  .meta time { margin-left: .5em; cursor: default; } .row.mine .meta time { margin-left: 0; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid;
            place-items: center; font-size: 14px; font-weight: 600; color: #fff;
            background: var(--accent); user-select: none; }
  .avatar.bot { background: linear-gradient(135deg, #3370ff, #8b5cf6); font-size: 12px; }
</style>
</head>
<body>
<header>General Agent on AgentCore <small id="who">connecting…</small><span style="flex:1"></span><a id="admin" class="ghost" href="admin.html" hidden>管理</a><button type="button" id="logout" class="ghost" hidden>退出</button></header>
<div id="log"></div>
<div id="pending"></div>
<form id="f">
  <button type="button" id="attach" class="ghost" title="发送图片" disabled>＋</button>
  <input type="file" id="file" accept="image/*" hidden>
  <input type="text" id="q" placeholder="说点什么…（/help 查看命令）" autocomplete="off" disabled>
  <button id="send" disabled>发送</button>
</form>

<script>
const log = document.getElementById('log');
const $ = (id) => document.getElementById(id);

// Today's messages carry the time alone, older ones the date too.
const clock = (d) => {
  const hm = d.toTimeString().slice(0, 5);
  return d.toDateString() === new Date().toDateString() ? hm
    : `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
};

// The exact moment, on hover: 2026-10-25 Sun 22:14:51.
const fullClock = (d) => {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} `
    + `${d.toLocaleDateString('en-US', {weekday: 'short'})} ${d.toTimeString().slice(0, 8)}`;
};

// A message from the user or the agent gets an avatar, the sender and the time; status lines
// and errors stay bare. `when` is null for history older than the agent's own timestamps.
function placed(el, mine, when) {
  const row = document.createElement('div');
  row.className = 'row' + (mine ? ' mine' : '');
  const face = document.createElement('div');
  face.className = 'avatar' + (mine ? '' : ' bot');
  face.textContent = mine ? me.initial() : 'AI';
  const meta = document.createElement('div');
  meta.className = 'meta';
  if (!mine) meta.append('Agent');
  if (when) {
    const t = document.createElement('time');
    t.textContent = clock(when);
    t.title = fullClock(when);
    t.dateTime = when.toISOString();
    meta.append(t);
  }
  const col = document.createElement('div');
  col.className = 'col';
  col.append(meta, el);
  row.append(face, col);
  log.append(row);
  log.scrollTop = log.scrollHeight;
  return el;
}

const say = (cls, text, when = new Date()) => {
  const el = document.createElement('div');
  el.className = 'msg ' + cls; el.textContent = text;
  if (['me', 'bot', 'cmd'].includes(cls)) return placed(el, cls === 'me', when);
  log.append(el); log.scrollTop = log.scrollHeight; return el;
};

// Whose avatar the user's messages carry: the signed-in email's first letter, or 我 in Lark.
const me = {initial: () => (!inLark() && login.email() || '我').charAt(0).toUpperCase()};

// Markdown is re-rendered from the accumulated source on every delta: parsing a partial
// stream incrementally would produce broken trees mid-token. `breaks` because a chat
// message's single newline is a line break, not the paragraph continuation markdown assumes.
const md = (raw) => (window.marked && window.DOMPurify)
  ? DOMPurify.sanitize(marked.parse(raw, {breaks: true, gfm: true})) : null;

function sayMarkdown(raw) {
  const el = say('bot', '');
  el.dataset.md = '';
  paintMarkdown(el, raw || '');
  return el;
}

function paintMarkdown(el, raw) {
  el.dataset.md = raw;
  const html = md(raw);
  if (html === null) { el.style.whiteSpace = 'pre-wrap'; el.textContent = raw; }
  else el.innerHTML = html;  // nosemgrep: insecure-document-method — md() returns DOMPurify-sanitised HTML
  log.scrollTop = log.scrollHeight;
}

// Deploy-time values, injected so the page needs no build step.
const ROUTER = window.ROUTER_BASE || '';
let session = null;

const enableInput = (on) => {
  for (const id of ['q', 'send', 'attach']) $(id).disabled = !on;
};

// Inside the Lark client the user is a Lark user; anywhere else they sign in at the hosted
// login. Told apart by the client's user agent rather than by the SDK, which defines itself
// in any browser — and the SDK is only fetched when this deployment has Lark at all.
const inLark = () => !!window.LARK_APP_ID && /Lark|Feishu/i.test(navigator.userAgent);

async function connect() {
  try {
    $('who').textContent = '正在识别身份…';
    if (inLark()) await loadLarkSdk();
    else {
      await login.ready();
      $('logout').hidden = false;
      // Same tab, so the admin page keeps this tab's sign-in.
      $('admin').hidden = !login.groups().includes('admins');
    }
    session = await fetchSession();
    // Input stays disabled until the transcript has landed: a message sent mid-restore
    // would be appended first and then have the older history arrive above it.
    await restore();
    $('who').textContent = '已连接';
    enableInput(true);
    $('q').focus();
    consent.resume();
  } catch (e) {
    $('who').textContent = '未连接';
    say('err', '无法建立会话：' + e.message);
  }
}

const fetchSession = async () => inLark()
  ? routerPost('/web/h5/session', {code: await larkAuthCode()})
  : routerPost('/web/session', {});

// The router owns the session ids and drops them on a deploy or on /new from Lark chat, so a
// turn re-reads them first; a thread changed elsewhere takes the stale transcript with it.
async function syncSession(...keep) {
  const next = await fetchSession();
  if (session && next.memorySessionId !== session.memorySessionId) {
    log.innerHTML = '';
    log.append(...keep);
  }
  session = {...session, ...next};
}

// The router: inside Lark a fresh h5 code proves who is asking each time; outside, the
// signed-in user's own token does, checked by the API's JWT authorizer.
async function routerPost(path, body, token) {
  const headers = {'Content-Type': 'application/json'};
  if (!inLark()) headers.Authorization = 'Bearer ' + (token || await login.token());
  const r = await fetch(ROUTER + path, {method: 'POST', headers, body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}

function loadLarkSdk() {
  return new Promise((resolve, reject) => {
    // This exact path, not the /goofy/locality/openplatform/ one — that 404s, so h5sdk
    // never defines itself. No integrity hash: Lark's CDN makes no immutability promise.
    const s = document.createElement('script');
    s.src = 'https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.34.js';  // nosemgrep: missing-integrity — vendor CDN, no immutability promise
    s.onload = resolve;
    s.onerror = () => reject(new Error('h5sdk 未加载（CDN 脚本没取到）'));
    document.head.append(s);
  });
}

// Lark's h5 SDK hands out a single-use code; that is the whole identity step.
// The two globals fail for different reasons and must be reported apart: h5sdk comes from
// the script loaded above, tt is injected by the client.
function larkAuthCode() {
  return new Promise((resolve, reject) => {
    if (!window.h5sdk) return reject(new Error('h5sdk 未加载（CDN 脚本没取到）'));
    if (!window.tt) return reject(new Error('不在 Lark 客户端内'));
    window.h5sdk.error((err) => reject(new Error('h5sdk: ' + JSON.stringify(err))));
    window.h5sdk.ready(() => window.tt.requestAuthCode({
      appId: window.LARK_APP_ID,
      success: (res) => resolve(res.code),
      // Lark matches the request against the app's Redirect URLs by exact page URL, so
      // error 10236 is unreadable without knowing which URL the client actually loaded.
      fail: (err) => reject(new Error('requestAuthCode: ' + JSON.stringify(err)
                                     + '\n当前页面：' + location.href)),
    }));
  });
}

$('logout').addEventListener('click', () => login.signOut());

// Authorising a system on demand. The link is minted through /auth when the user clicks,
// not when the tool was refused: a consent can be completed only with the very token it was
// started with, and minting at the click is what lets the page know which token that is.
// After consenting, the browser comes back to this page with `#consent=<session>`, and the
// tab that holds that session's token completes it at /web/consent and resends the message
// the refusal interrupted — as Lark chat replays it.
const LABELS = {lark: 'Lark', google: 'Google'};
let lastAsk = null;          // the message a refusal interrupted, to send again after consent

const consent = (() => {
  const channel = 'BroadcastChannel' in window ? new BroadcastChannel('consent') : null;
  const pending = () => JSON.parse(sessionStorage.getItem('consents') || '{}');
  const keep = (all) => sessionStorage.setItem('consents', JSON.stringify(all));
  const sessionOf = (url) => new URL(url).searchParams.get('request_uri') || '';
  // Before any sign-in redirect, which would drop the fragment.
  const back = new URLSearchParams(location.hash.slice(1)).get('consent');
  if (back) {
    sessionStorage.setItem('consentBack', back);
    history.replaceState(null, '', location.pathname + location.search);
  }

  // Whether the consent completed; null when this tab holds no such consent.
  async function complete(id) {
    const p = pending()[id];
    if (!p) return null;
    const done = await routerPost('/web/consent', {sessionId: id}, p.token)
      .catch((e) => ({ok: false, error: e.message}));
    const all = pending(); delete all[id]; keep(all);
    if (!done.ok) { say('err', `授权没有完成：${done.error || '未知原因'}，请再点一次授权。`); return false; }
    say('cmd', `✅ 已授权 ${LABELS[p.idp] || p.idp}`);
    // The prompts that asked for it are answered: their buttons give way to the outcome.
    document.querySelectorAll(`.consent[data-idp="${CSS.escape(p.idp)}"] button`).forEach((btn) => {
      const done = document.createElement('span');
      done.className = 'done'; done.textContent = '✅ 已授权';
      btn.replaceWith(done);
    });
    if (p.retry) send(p.retry);
    return true;
  }

  if (channel) channel.onmessage = async ({data}) => {
    if (data.type === 'consent' && pending()[data.id]) {
      const ok = await complete(data.id);
      channel.postMessage({type: 'consent-done', id: data.id, ok});
    }
  };

  return {
    // A link /auth handed back: keep the token it was minted with, under its session.
    minted(url, token, idp, retry) {
      if (!token) return;            // inside Lark: the router completes it, with the Lark token
      const id = sessionOf(url);
      if (id) keep({...pending(), [id]: {token, idp: idp || '', retry: retry || null}});
    },
    prompt(idp) {
      const label = LABELS[idp] || idp;
      const retry = lastAsk;
      const el = document.createElement('div');
      el.className = 'consent';
      el.dataset.idp = idp;
      const b = document.createElement('button');
      b.textContent = `授权 ${label}`;
      el.append(document.createTextNode(`这一步需要访问你的 ${label} 账号。`), b);
      b.onclick = async () => {
        b.disabled = true;
        // Opened before the request so a popup blocker sees a click, not a callback.
        const w = window.open('', '_blank');
        // The link takes a second or two to mint; an empty window reads as a broken one.
        if (w) { w.document.title = `授权 ${label}`; w.document.body.textContent = `正在打开 ${label} 授权页…`; }
        try {
          const token = inLark() ? '' : await login.token();
          const body = inLark()
            ? await routerPost('/web/h5/command', {code: await larkAuthCode(), command: `/auth ${idp}`})
            : await routerPost('/web/command', {command: `/auth ${idp}`}, token);
          if (!body.link) { if (w) w.close(); say('cmd', body.text || '已授权'); return; }
          this.minted(body.link.url, token, idp, retry);
          if (w) w.location = body.link.url; else location.assign(body.link.url);
          if (inLark()) say('cmd', `授权完成后回到这里，再发一次刚才的消息。`);
        } catch (e) {
          if (w) w.close();
          say('err', '无法开始授权：' + e.message);
        } finally { b.disabled = false; }
      };
      return el;
    },
    // Called once signed in: finish a consent this page was sent back from.
    async resume() {
      const id = sessionStorage.getItem('consentBack');
      if (!id) return;
      sessionStorage.removeItem('consentBack');
      if (await complete(id) === null) say('err', '请回到发起授权的页面，再点一次授权。');
    },
    // Consented in a window that does not hold the token — the one the button opened: hand
    // the consent to the tab that does and close, without signing in or showing the chat.
    // True when this page is that window.
    handoff() {
      const id = sessionStorage.getItem('consentBack');
      if (!id || pending()[id] || !channel || inLark()) return false;
      sessionStorage.removeItem('consentBack');
      document.body.innerHTML = '';
      const note = document.createElement('div');
      note.className = 'msg cmd';
      note.style.margin = '2rem auto';
      note.textContent = '正在完成授权…';
      document.body.append(note);
      new Promise((resolve) => {
        const t = setTimeout(() => resolve(null), 5000);
        channel.addEventListener('message', ({data}) => {
          if (data.type === 'consent-done' && data.id === id) { clearTimeout(t); resolve(data); }
        });
        channel.postMessage({type: 'consent', id});
      }).then((answered) => {
        if (answered && answered.ok) {
          note.textContent = '✅ 授权完成，可以关闭这个窗口。';
          window.close();   // allowed: the page's own button opened this window
        } else {
          note.textContent = answered ? '授权没有完成，请回到对话页再点一次授权。'
                                      : '没有找到发起授权的页面。请回到对话页，再点一次授权。';
        }
      });
      return true;
    },
  };
})();

const uuid = () => crypto.randomUUID();
// The router's own routing key, not one of our own: a session id maps to exactly one
// microVM, so sharing it puts this tab and the Lark chat in the same container — which is
// what lets the agent serialise the two instead of them corrupting one conversation.
// Falls back to a page-local id only if an older router did not send one.
const runtimeSession = () => session.runtimeSessionId
  || ('web-' + uuid() + uuid().slice(0, 8));

const runtimeUrl = () =>
  `https://bedrock-agentcore.${session.region}.amazonaws.com/runtimes/`
  + `${encodeURIComponent(session.runtimeArn)}/invocations`
  + `?qualifier=${encodeURIComponent(session.qualifier)}`;

// The token of whoever is signed in: the Lark user's from /web/h5/session, or the web user's
// own. The agent takes the actor from it and refuses a payload naming anybody else.
const currentToken = async () => inLark() ? session.token : login.token();

const runtimeHeaders = async (accept, token) => ({
  'Content-Type': 'application/json', 'Accept': accept,
  'Authorization': 'Bearer ' + (token || await currentToken()),
  'X-Amzn-Bedrock-AgentCore-Runtime-Session-Id': runtimeSession(),
});

// A reload shows what the agent remembers, read back from the checkpoint — not a copy this
// tab was keeping. After summarisation or /clear the two would disagree, and the checkpoint
// is the one that decides the next turn.
async function restore() {
  // This is the slowest step on a cold load — it builds the session (which verifies the
  // actor and hands-shakes every MCP server), so it must say so rather than look hung.
  $('who').textContent = '正在读取对话记录…';
  const waiting = say('think', '正在读取对话记录…');
  let data;
  try {
    const r = await fetch(runtimeUrl(), {
      method: 'POST', headers: await runtimeHeaders('application/json'),
      body: JSON.stringify({action: 'transcript', actorId: session.actorId,
                            memorySessionId: session.memorySessionId}),
    });
    data = await r.json();
  } catch {
    waiting.className = 'msg think';
    waiting.textContent = '（读取对话记录失败，历史未显示，但对话可以继续）';
    return;
  } finally {
    if (waiting.textContent === '正在读取对话记录…') waiting.remove();
  }
  const msgs = (data && data.messages) || [];
  // Reloaded mid-answer: the turn runs on, streaming to the page that started it.
  const note = () => { if (data && data.running) say('think', '（上一轮还在回答中，结束后刷新即可看到）'); };
  if (!msgs.length) return note();
  if (data.truncated) say('think', '（仅显示最近的对话）');
  // The same shape as a live turn. Messages from before the agent kept times have none.
  const at = (m) => m.ts ? new Date(m.ts) : null;
  let past = null, calls = 0;
  const flush = () => {
    if (calls) past.append(pill(`🔧 调用工具${times(calls)}`, ''));
    calls = 0;
  };
  for (const m of msgs) {
    if (m.role === 'user' || m.role === 'summary') {
      flush(); past = null;
      // A picture is kept as a placeholder, not its pixels: show that one was sent.
      if (m.role === 'user') say('me', (m.content || '').replace(/\[image \d+(?:: | msg=)[^\]]*\]/g, '🖼️'), at(m));
      else say('think', '（更早的对话已压缩为摘要）');
      continue;
    }
    if (!past) { past = document.createElement('div'); past.className = 'msg bot turn'; placed(past, false, at(m)); }
    if (m.role === 'file') { flush(); past.append(sentFile(m)); continue; }
    if (m.role === 'toolCall') calls += 1;
    else if (m.role === 'assistant' && (m.content || '').trim()) {
      flush();
      const block = document.createElement('div'); block.className = 'block';
      past.append(block); paintMarkdown(block, m.content);
    }
  }
  flush();
  note();
}

// Inside Lark a command carries a fresh code; outside, the signed-in user's token. A link
// it hands back is a consent, minted with that token — the one that must complete it.
async function runCommand(command) {
  const token = inLark() ? '' : await login.token();
  let body;
  try {
    body = inLark()
      ? await routerPost('/web/h5/command', {code: await larkAuthCode(), command})
      : await routerPost('/web/command', {command}, token);
  } finally {
    firstEventArrived();   // drop the placeholder before the answer, not after
  }
  // The system it is for names the outcome: 「✅ 已授权 Lark」, not a bare 「✅ 已授权」.
  if (body.link) consent.minted(body.link.url, token, (command.match(/^\/auth\s+(\S+)/) || [])[1]);
  // Not markdown: this is aligned diagnostic output, where the runs of spaces and the line
  // breaks are the formatting. The link is a real anchor rather than markdown for the same
  // reason — nothing here is parsed.
  // These change which thread the next turn reads, so the transcript on screen is no longer
  // this conversation. Leaving it would show history the agent has stopped remembering.
  if (/^\/(clear|reset|new)\b/.test(command)) {
    log.innerHTML = '';
    await syncSession();
  }
  const el = say('cmd', body.text || '');
  if (body.link) {
    const a = document.createElement('a');
    a.href = body.link.url; a.textContent = body.link.text; a.target = '_blank';
    el.append(document.createElement('br'), a);
  }
}

// Nothing here carries authority: the agent takes the actor from the token, refuses a
// memorySessionId outside that actor's threads, and replaces AG-UI's threadId with it.
// streamId names this page load, so a message joins only a turn whose answer streams here.
const STREAM = uuid();
const runBody = (content) => ({actorId: session.actorId, memorySessionId: session.memorySessionId,
                               runId: uuid(), threadId: 'resolved-by-agent',
                               messages: [{id: uuid(), role: 'user', content}],
                               tools: [], context: [], state: {},
                               forwardedProps: {streamId: STREAM}});

const postRun = async (content) => fetch(runtimeUrl(), {
  method: 'POST', body: JSON.stringify(runBody(content)),
  headers: await runtimeHeaders('text/event-stream'),
});

// Each AG-UI event of a response, in order; `onEvent` may await.
async function readEvents(res, onEvent) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    const frames = buf.split('\n\n'); buf = frames.pop();
    for (const frame of frames) {
      const line = frame.split('\n').find(l => l.startsWith('data: '));
      if (!line) continue;
      let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
      await onEvent(ev);
    }
  }
}

// A message sent while this tab's turn runs joins it, as in Lark chat: the agent hands it to
// the running turn, whose stream carries the answer — below this message, on a card of its
// own — and this request only says it was taken. If the turn had just ended, the thread was
// free and this request is a turn of its own: shown once the one before has finished.
let steerQueue = [];   // texts handed to the running turn, oldest first
async function steerIn(text) {
  const res = await postRun(text);
  if (!res.ok) return say('err', '请求失败：' + res.status);
  let decided = false, own = false;
  const started = [];
  await readEvents(res, async (ev) => {
    if (!decided) {
      if (ev.type === 'RUN_STARTED') { started.push(ev); return; }
      decided = true;
      if (ev.type === 'CUSTOM' && ev.name === 'queued') { steerQueue.push(text); return; }
      if (ev.type === 'RUN_ERROR') { say('err', ev.message || '出错了'); return; }
      own = true;
      await turnDone;
      beginTurn(text);
      started.forEach(render);
    }
    if (own) render(ev);
  });
  if (own) endTurn();
}

async function ask(content) {
  const res = await postRun(content);
  if (!res.ok) throw new Error('请求失败：' + res.status);
  await readEvents(res, render);
}

// --- the answer, laid out the way the Lark card is ----------------------------
// One block per turn: the answer's text with status lines between its parts, where they
// happened, and a one-line summary at the end. A status line says what the turn is doing
// now — thinking, a tool running — with moving dots instead of a clock, and when text
// resumes it freezes as the record of that wait ("🤔 思考 · 3 秒 · 🔧 调用工具 ×2 · 5 秒").
// Tools are not named: the chat is not a log (agent/lark_notify.py, StreamingCard).
let turn = null, waitingForFirst = null;

// Between submit and the first event there is real latency (session assembly, MCP
// handshake, model). Cleared by whichever event arrives first.
function firstEventArrived() {
  if (waitingForFirst) { waitingForFirst.remove(); waitingForFirst = null; }
}

const secs = (ms) => Math.max(1, Math.round(ms / 1000));
const times = (n) => n > 1 ? ` ×${n}` : '';

function pill(text, dots) {
  const el = document.createElement('div');
  el.className = 'pill';
  setPill(el, text, dots);
  return el;
}

function setPill(el, text, dots) {
  el.textContent = text;
  if (dots) {
    const d = document.createElement('span');
    d.className = 'dots ' + dots;
    d.innerHTML = '<i></i><i></i><i></i>';
    el.append(d);
  }
}

class Turn {
  constructor() {
    this.el = document.createElement('div');
    this.el.className = 'msg bot turn';
    placed(this.el, false, new Date());
    this.t0 = this.since = performance.now();
    this.phase = 'think';
    this.steps = {think: 0, tool: 0, write: 0};
    this.toolsDone = 0;
    this.gap = {think: 0, tool: 0, tools: 0};
    this.text = null; this.raw = '';
    this.live = pill('🤔 思考中', 'think');
    this.el.append(this.live);
    this.scroll();
  }
  scroll() { log.scrollTop = log.scrollHeight; }
  enter(phase) {
    const now = performance.now(), spent = now - this.since;
    if (this.steps[this.phase] !== undefined) this.steps[this.phase] += spent;
    if (this.live && (this.phase === 'think' || this.phase === 'tool')) this.gap[this.phase] += spent;
    this.phase = phase; this.since = now;
    this.paintLive();
  }
  done() {          // what a finished wait leaves behind
    const parts = [];
    if (this.gap.think >= 1000) parts.push(`🤔 思考 · ${secs(this.gap.think)} 秒`);
    if (this.gap.tools) parts.push(`🔧 调用工具${times(this.gap.tools)} · ${secs(this.gap.tool)} 秒`);
    return parts.join(' · ');
  }
  paintLive() {
    if (!this.live) return;
    if (this.phase === 'tool') setPill(this.live, `🔧 调用工具${times(this.gap.tools + 1)}`, 'work');
    else if (this.phase === 'think') {
      const tools = this.gap.tools ? `🔧 调用工具${times(this.gap.tools)} · ${secs(this.gap.tool)} 秒 · ` : '';
      setPill(this.live, tools + '🤔 思考中', 'think');
    }
  }
  startWait() {     // text stopped and something else began
    if (this.text) { this.text = null; this.raw = ''; }
    if (!this.live) { this.live = pill('', ''); this.el.append(this.live); }
  }
  endWait() {       // the wait is over: its line freezes as a record, or goes
    if (!this.live) return;
    const record = this.done();
    if (record) setPill(this.live, record, ''); else this.live.remove();
    this.live = null;
    this.gap = {think: 0, tool: 0, tools: 0};
  }
  toolStarted() {
    if (this.phase === 'tool') return;
    this.startWait(); this.enter('tool'); this.scroll();
  }
  toolFinished() {
    this.toolsDone += 1;
    if (this.live) this.gap.tools += 1;
    this.enter('think');
  }
  write(delta) {
    if (!delta) return;
    if (this.phase !== 'write' && !(this.raw + delta).trim()) { this.raw += delta; return; }
    if (this.phase !== 'write') this.enter('write');
    if (!this.text) {
      this.endWait();
      this.text = document.createElement('div');
      this.text.className = 'block';
      this.el.append(this.text);
    }
    this.raw += delta;
    paintMarkdown(this.text, this.raw.trimStart());
  }
  append(el) { this.el.append(el); this.scroll(); }
  isEmpty() { return !this.el.querySelector('.block, .file, .consent') && !this.toolsDone; }
  compacting(started) {   // a summary is written without a word streamed, so say so
    if (started) {
      this.compactSince = performance.now();
      this.compact = pill('🗜️ 正在整理较早的对话', 'work');
      this.append(this.compact);
    } else if (this.compact) {
      setPill(this.compact, `🗜️ 整理较早的对话 · ${secs(performance.now() - this.compactSince)} 秒`, '');
      this.compact = null;
    }
  }
  finish() {
    this.enter('done'); this.endWait();
    const parts = [];
    if (this.steps.think >= 500) parts.push(`思考 ${secs(this.steps.think)} 秒`);
    if (this.toolsDone) parts.push(`${this.toolsDone} 次工具调用 ${secs(this.steps.tool)} 秒`);
    if (this.steps.write >= 500) parts.push(`撰写回答 ${secs(this.steps.write)} 秒`);
    const band = document.createElement('div');
    band.className = 'band';
    band.textContent = `⏱️ 耗时 ${secs(performance.now() - this.t0)} 秒`
      + (parts.length ? `（${parts.join(' · ')}）` : '');
    this.append(band);
  }
}

// A file the agent sent: a picture shows, anything else downloads. A stored one comes as a
// short-lived link (re-signed whenever the history is read), served inline only if it is a
// raster picture; one the deployment could not store comes as bytes, gone on reload.
const PICTURES = {png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif',
                  webp: 'image/webp', bmp: 'image/bmp'};
function sentFile({name, size, data, url}) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  let href = url;
  if (!href && data) {
    const bytes = Uint8Array.from(atob(data), (c) => c.charCodeAt(0));
    href = URL.createObjectURL(new Blob([bytes], {type: PICTURES[ext] || 'application/octet-stream'}));
  }
  const box = document.createElement('div');
  box.className = 'file';
  if (href && PICTURES[ext]) {
    const img = document.createElement('img');
    img.src = href; img.alt = name;
    box.append(img);
  }
  const label = `📎 ${name}（${size >= 1e6 ? (size / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(size / 1e3)) + ' kB'}）`;
  if (!href) {          // a history entry whose link could not be signed
    box.append(label);
    return box;
  }
  const a = document.createElement('a');
  a.href = href; a.textContent = label; a.target = '_blank'; a.rel = 'noopener';
  if (!url) a.download = name;   // a stored file names itself in its Content-Disposition
  box.append(a);
  return box;
}

function render(ev) {
  // Marks about the conversation, not content: none of them opens a card.
  const mark = ev.type === 'CUSTOM' && ['steered', 'queued', 'unanswered'].includes(ev.name);
  if (!turn && ev.type !== 'RUN_ERROR' && !mark) turn = new Turn();
  // The card has its own 思考中; the placeholder only covers the wait for it.
  if (turn || ev.type !== 'RUN_STARTED') firstEventArrived();
  switch (ev.type) {
    // The stream ends by itself, so this only matters as the signal that it ended
    // cleanly — a dropped connection looks identical without it.
    case 'RUN_FINISHED': turn.finish(); turn = null; break;
    case 'RUN_ERROR': say('err', ev.message || '出错了'); break;
    case 'TEXT_MESSAGE_CONTENT':
    case 'TEXT_MESSAGE_CHUNK': turn.write(ev.delta || ''); break;
    case 'TOOL_CALL_START': turn.toolStarted(); break;
    // The result is what proves a tool ran rather than the model narrating one.
    case 'TOOL_CALL_RESULT': turn.toolFinished(); break;
    // A tool of this run was refused for want of a grant: offer to authorise, here.
    case 'CUSTOM':
      if (ev.name === 'consent') turn.append(consent.prompt(ev.value && ev.value.idp));
      if (ev.name === 'file' && ev.value) turn.append(sentFile(ev.value));
      // What follows answers a message sent mid-turn, which sits below this card. A card
      // that shows nothing yet is dropped rather than left as an empty one.
      if (ev.name === 'steered') {
        if (turn && turn.isEmpty()) turn.el.closest('.row').remove();
        else if (turn) turn.finish();
        turn = null;
        lastAsk = steerQueue.splice(0).join('\n') || lastAsk;
      }
      if (ev.name === 'unanswered') {
        say('err', `还有 ${(ev.value && ev.value.count) || 1} 条消息没来得及处理，请重新发送。`);
        steerQueue = [];
      }
      if (ev.name === 'compacting' && turn) turn.compacting(!!(ev.value && ev.value.started));
      break;
  }
}

// --- image attachment -------------------------------------------------------
// Inlined as base64 in the AG-UI message rather than uploaded anywhere: no storage, no
// second credential, and the turn stays a single request. 4 MB matches the Lark path.
const MAX_IMAGE_BYTES = 4 * 1024 * 1024;
let attached = null;

$('attach').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async () => {
  const f = $('file').files[0];
  $('file').value = '';
  if (!f) return;
  if (f.size > MAX_IMAGE_BYTES) return say('err', '图片超过 4 MB，换一张小一点的。');
  const dataUrl = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => rej(new Error('读取失败'));
    r.readAsDataURL(f);
  });
  attached = {mimeType: f.type, value: dataUrl.split(',')[1], dataUrl};
  showPending();
});

function showPending() {
  const p = $('pending');
  p.innerHTML = '';
  if (!attached) { p.style.display = 'none'; return; }
  p.style.display = 'flex';
  const img = document.createElement('img'); img.src = attached.dataUrl;
  const drop = document.createElement('button');
  drop.type = 'button'; drop.className = 'ghost'; drop.textContent = '×';
  drop.onclick = () => { attached = null; showPending(); };
  p.append(img, document.createTextNode('已附图片'), drop);
}

// One message out: a /command to the router, anything else as a turn to the Runtime.
let running = false;   // this tab's turn is streaming
let turnDone = Promise.resolve(), turnEnded = () => {};

// Text can still be sent while the answer streams; it joins this turn.
function beginTurn(text) {
  lastAsk = text;
  running = true;
  turnDone = new Promise((resolve) => { turnEnded = resolve; });
  $('q').disabled = false; $('send').disabled = false;
  $('q').placeholder = '回答中，可以继续补充…';
  $('q').focus();
}

function endTurn() {
  running = false;
  steerQueue = [];
  $('q').placeholder = '说点什么…（/help 查看命令）';
  firstEventArrived();   // also the fallback for a turn that produced no events at all
  if (turn) { turn.finish(); turn = null; }   // a stream that broke off still ends its turn
  enableInput(true);
  $('q').focus();
  turnEnded();
}

async function send(text, image = null) {
  const isCommand = text.startsWith('/') && !image;
  if (running) {
    if (isCommand || image) return say('err', isCommand ? '这一轮回答结束后再发命令。' : '这一轮回答结束后再发图片。');
    say('me', text);
    try { await steerIn(text); } catch (err) { say('err', String(err && err.message || err)); }
    return;
  }
  const mine = say('me', text);
  if (image) {
    const img = document.createElement('img'); img.src = image.dataUrl; mine.append(img);
  }
  enableInput(false);
  waitingForFirst = say('think', isCommand ? '执行中…' : '思考中…');
  try {
    if (isCommand) await runCommand(text);
    else {
      await syncSession(mine.closest('.row'), waitingForFirst);
      beginTurn(image ? null : text);
      await ask(image
        ? [{type: 'text', text: text || '看看这张图。'},
           {type: 'image', source: {type: 'data', value: image.value, mimeType: image.mimeType}}]
        : text);
    }
  } catch (err) { say('err', String(err && err.message || err)); }
  endTurn();
}

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = $('q');
  const text = q.value.trim();
  if ((!text && !attached) || !session) return;
  q.value = '';
  const image = attached; attached = null; showPending();
  await send(text, image);
});

if (!consent.handoff()) connect();
</script>
</body>
</html>
