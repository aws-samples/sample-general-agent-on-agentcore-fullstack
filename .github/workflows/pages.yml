# Publishes workshop/ as a website (mdBook) to GitHub Pages; Settings → Pages → Source must be "GitHub Actions".
name: workshop-pages

on:
  push:
    branches: [main]
    paths: ["workshop/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: v0.5.4
    steps:
      - uses: actions/checkout@v4
      # The release binary rather than a third-party action, so only GitHub-owned actions run here.
      - name: Install mdBook
        run: |
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
          mdbook --version
      - name: Build
        run: mdbook build workshop -d "$RUNNER_TEMP/book"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
